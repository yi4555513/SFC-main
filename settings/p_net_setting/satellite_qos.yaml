topology:
  num_nodes: 66
  type: waxman
  wm_alpha: 0.5
  wm_beta: 0.2
  file_path: D:/any download/virne-main/virne-main/datasets/topology/snapshots/satellite_graph_t0.gml
node_attrs_setting:
- name: cpu
  type: resource
  owner: node
  distribution: uniform
  dtype: int
  generative: true
  high: 100
  low: 50
- name: max_cpu
  type: extrema
  owner: node
  originator: cpu
- name: ram
  type: resource
  owner: node
  distribution: uniform
  dtype: int
  generative: true
  high: 100
  low: 50
- name: max_ram
  type: extrema
  owner: node
  originator: ram
link_attrs_setting:
- name: bw
  type: resource
  owner: link
  distribution: uniform
  dtype: int
  generative: true
  high: 100
  low: 50
- name: max_bw
  type: extrema
  owner: link
  originator: bw
- name: ltc
  owner: link
  type: latency
  generative: false
  distribution: customized
  max: 10.0
  min: 0.0
- name: loss
  type: information
  owner: link
  distribution: uniform
  dtype: float
  generative: true
  low: 0.001
  high: 0.008
output:
  save_dir: dataset/p_net
  file_name: p_net.gml
