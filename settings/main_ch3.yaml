defaults:
  - learning
  - v_sim_setting/satellite
  - p_net_setting/satellite_snap
  - _self_
hydra:
  run:
    dir: ./results
  job:
    name: main
    chdir: false
output_subdir: null

experiment:
  seed: 0
  run_id: auto
  num_simulations: 1
  save_root_dir: results/main_ch3/
  if_save_config: true
  if_save_p_net: true
  if_save_v_nets: true
  if_load_p_net: false
  if_load_v_nets: false
  share: false

system:
  renew_v_net_simulator: false
  if_offline_system: false
  if_changeable_v_nets: false
  if_time_window: false
  time_window_size: 100

solver:
  solver_name: 'ppo_gat_seq2seq+'
  matching_mathod: greedy
  shortest_method: k_shortest
  reusable: false
  node_ranking_method: order
  link_ranking_method: order
  k_shortest: 10
  path_ranking:
    # Align with the stable Ch3 PPO-MLP+ run: rank k-shortest candidates by latency/resource score.
    enabled: true
    method: score
    latency_weight: 1.0
    r2c_weight: 1.0
    use_service_weight: true
    feasible_first: true
  objective:
    # resource: original MIP/ACO objective; final total_latency is still checked after solving.
    name: resource
    resource_weight: 1.0
    # Keep latency as a secondary term; resource cost / r2c remains dominant.
    latency_weight: 1.0
    latency_norm: 300.0
    # For MIP only: whether to add max-latency as an in-model hard constraint.
    # Keep it false here: MIP optimizes resource+latency first, and QoS is
    # checked after solving by the common result checker.
    enforce_latency_constraint: false
    # For MIP load experiments, prefer a soft latency constraint: if a solution
    # can satisfy max_latency, the large slack penalty guides SCIP to choose it;
    # if no such solution is found within the time limit, MIP still returns the
    # best resource-feasible mapping instead of failing immediately.
    soft_latency_constraint: false
    latency_slack_penalty: 1000.0
    latency_constraint_margin: 0.0
  mip_time_limit_seconds: 5
  mip_debug_print_solution: false
  mip_post_reroute: false
  mip_reroute_shortest_method: k_shortest
  mip_reroute_k: 10
  allow_revocable: false
  allow_rejection: false
  fix_endpoint_vnfs: true
  include_endpoint_latency: true
  sub_solver_name: null
  pretrained_model_path: ''
  pretrained_subsolver_model_path: ''

rl:
  reward_calculator:
    name: fixed_intermediate
    intermediate_reward: 0.2
    success_bonus: 1.0
    failure_penalty: 2.0
    r2c_weight: 2.0
    latency_weight: 1.0
    # Optional dense incremental reward terms.  They are only used when
    # rl.reward_calculator.name=fixed_incremental.
    increment_delay_weight: 0.3
    increment_cost_weight: 0.2
    cost_norm: 100.0
    reward_scale: 10.0
    latency_norm: 300.0
    clip_min: -100.0
    clip_max: 200.0
  feature_constructor:
    extracted_attr_types: ["resource", "latency"]

recorder:
  record_dir_name: records
  if_save_records: true
  if_temp_save_records: true
  summary_file_name: summary.csv

logger:
  log_dir_name: logs
  project_name: 'main'
  experiment_name: chapter3_experiment
  level: INFO
  verbose: 1
  backends: ['console', 'file', 'tensorboard']
  log_show_interval: 20
  log_file_name: 'running.log'
