# Virtual Network Simulation Configuration

num_v_nets: 600
fixed_total_time_ms: 600000
# Optional: physical topology snapshot duration. 100000 ms = 100 seconds.
snapshot_duration_ms: null
auto_num_v_nets_from_arrival_rate: true

topology:
  type: path

v_net_size:
  distribution: uniform
  dtype: int
  low: 4
  high: 8

arrival_rate:
  distribution: poisson
  dtype: float
  lam: 0.001  # 是每 ms 的到达请求数
  reciprocal: true

lifetime:
  distribution: uniform
  dtype: int
  low: 4000
  high: 8000   # ms; average 6 s for load experiments

max_latency:
  distribution: uniform
  dtype: float
  low: 100   # 单位 ms
  high: 300

node_attrs_setting:
  - name: cpu
    distribution: uniform
    dtype: int
    generative: true
    low: 10
    high: 15
    owner: node
    type: resource
  - name: ram
    distribution: uniform
    dtype: int
    generative: true
    low: 10
    high: 20
    owner: node
    type: resource
  - name: v_type
    distribution: uniform
    dtype: int
    low: 1
    high: 10
    owner: node
    generative: true
    type: vnf_type

link_attrs_setting:
  - name: bw
    distribution: uniform
    dtype: int
    generative: true
    low: 15
    high: 20
    owner: link
    type: resource
#  - name: ltc
#    owner: link
#    type: latency
#    generative: true
#    distribution: uniform
#    high: 1.
#    low: 2.

graph_attrs_setting:


output:
  save_dir: dataset/v_nets
  v_nets_save_dir: v_nets
  v_nets_file_name: v_net.gml
  events_file_name: events.yaml
  setting_file_name: v_sim_setting.yaml
